<body class="is-locked">

<!-- ======================================================================
     GATE — the only thing in this file. Everything else is decrypted from
     content.enc into #site once the password checks out.
     ====================================================================== -->
<div id="gate" aria-labelledby="gate-title">
  <div class="gate-card" id="gate-card">
    <div class="monogram">R <em>&amp;</em> T</div>
    <p class="gate-date">21 &middot; 11 &middot; 2026</p>

    <h1 id="gate-title">You&rsquo;re invited</h1>
    <p class="gate-hint" id="gate-hint">Please enter the password from your invitation.</p>

    <form class="gate-form" id="gate-form" autocomplete="off">
      <label for="gate-input" hidden>Password</label>
      <input type="password" id="gate-input" name="password"
             placeholder="Password" autocomplete="current-password"
             autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button type="submit" class="btn" id="gate-submit">Enter</button>
      <p class="gate-error" id="gate-error" role="alert" aria-live="polite"></p>
    </form>
  </div>
</div>

<!-- Decrypted content is injected here. -->
<div id="site"></div>

<script src="js/app.js"></script>
